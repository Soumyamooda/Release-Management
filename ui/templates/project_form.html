{% extends "base.html" %}

{% block title %}{% if project %}Edit Project{% else %}New Project{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0">
                    <i class="bi bi-{% if project %}pencil{% else %}plus-circle{% endif %} me-2"></i>
                    {% if project %}Edit Project{% else %}New Project{% endif %}
                </h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="project_name" class="form-label fw-semibold">Project Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="project_name" name="project_name"
                               value="{{ project.project_name if project else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">Description</label>
                        <textarea class="form-control" id="description" name="description"
                                  rows="3">{{ project.description if project and project.description else '' }}</textarea>
                    </div>

                    <div class="mb-4">
                        <label for="status" class="form-label fw-semibold">Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="ACTIVE" {% if not project or project.status == 'ACTIVE' %}selected{% endif %}>Active</option>
                            <option value="INACTIVE" {% if project and project.status == 'INACTIVE' %}selected{% endif %}>Inactive</option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>
                            {% if project %}Save Changes{% else %}Create Project{% endif %}
                        </button>
                        <a href="{{ url_for('projects') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
