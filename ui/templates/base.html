<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Release Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-wrapper">
        <header class="app-header">
            <div class="header-left">
                <a href="{{ url_for('index') }}" class="header-brand">
                    <div class="header-icon-box">
                        <i class="bi bi-envelope"></i>
                    </div>
                    <span class="header-title">Release Manager</span>
                </a>
            </div>
            <div class="header-right">
                <a href="{{ url_for('hub_list') }}"
                   style="font-size:0.82rem;font-weight:600;color:#444;text-decoration:none;
                          border:1.5px solid #bbb;border-radius:4px;padding:5px 11px;margin-right:10px;">
                    ReleaseHub
                </a>
                <i class="bi bi-person-circle header-user-icon"></i>
                <span class="header-username">{{ session.user.name if session.user else 'User' }}</span>
                <a href="{{ url_for('logout') }}" style="font-size:0.78rem;color:#888;margin-left:10px;text-decoration:none;">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>
            </div>
        </header>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="px-4 pt-3">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <main class="app-main">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
